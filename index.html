<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HI-LO CARD MASTER - PREMIUM ARENA</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- 🎰 ক্যাসিনো হেডার ব্লকার (style.css দিয়ে হাইড লক করা ভাই ভাই) -->
    <div class="header">
        <div class="brand">
            <div class="class-name">HI-LO CARD MASTER</div>
            <div class="class-game">PREMIUM CASINO ARENA</div>
        </div>
        <div class="header-right">
            <button class="sound-btn" id="mute-btn" onclick="toggleMute()"></button>
            <div class="balance-box">৳ <span id="user-balance">0.00</span></div>
        </div>
    </div>

    <!-- 🏟️ হাই-লো ক্যাসিনো মেইন কার্ড শোডাউন টেবিল বোর্ড -->
    <div class="board-dealing-zone">
        <!-- কারেন্ট বেস কার্ড (BASE CARD) বক্স জোন -->
        <div class="board-column base-bg-glow">
            <div class="column-header-title header-base">BASE CARD (বর্তমান কার্ড)</div>
            <div class="cards-display-grid" id="base-card-container">
                <div class="card-back-default" id="base-card-slot" style="width: 70px; height: 100px; border-radius: 6px; overflow: hidden;"></div>
            </div>
        </div>

        <!-- নেক্সট ড্রপ কার্ড (NEXT CARD) বক্স জোন -->
        <div class="board-column next-bg-glow">
            <div class="column-header-title header-next">NEXT CARD (পরবর্তী কার্ড)</div>
            <div class="cards-display-grid" id="next-card-container">
                <div class="card-back-default" id="next-card-slot" style="width: 70px; height: 100px; border-radius: 6px; overflow: hidden;"></div>
            </div>
        </div>
    </div>

    <!-- 💸 বাজি ধরার প্রধান ৩টি নিয়ন গেটওয়ে বোতাম (HIGH, EQUAL, LOW ওডস চ্যাম লক ভাই) -->
    <div class="betting-board">
        <button class="bet-board-btn high-select-btn" id="board-HIGH" onclick="selectBetSide('HIGH')">
            <span class="board-label">📈 HIGH (বড়)</span>
            <span class="board-odds" id="odds-high">x2.0</span>
        </button>

        <button class="bet-board-btn equal-select-btn" id="board-EQUAL" onclick="selectBetSide('EQUAL')">
            <span class="board-label">⚖ EQUAL (সমান)</span>
            <span class="board-odds" id="odds-equal">x12.0</span>
        </button>

        <button class="bet-board-btn low-select-btn" id="board-LOW" onclick="selectBetSide('LOW')">
            <span class="board-label">📉 LOW (ছোট)</span>
            <span class="board-odds" id="odds-low">x2.0</span>
        </button>
    </div>

    <!-- 📢 উইন-লস লাইভ ক্যাসিনো মেসেজ প্যানেল বার -->
    <div class="win-status-container" id="win-status-box">
        <span id="win-text-msg">HIGH বা LOW সিলেক্ট করে DEAL বোতাম চাপুন ওস্তাদ!</span>
    </div>

    <!-- 🎛️ বাজি ধরার প্রধান অ্যাকশন কন্ট্রোল বোর্ড প্যানেল ফুটার -->
    <div class="footer-controls">
        <div class="play-section">
            <button class="bet-btn-nav" onclick="adjustBet('minus')">-</button>
            <div style="text-align: center; width: 60px;">
                <div style="font-size: 9px; color: #aaa; font-weight: bold;">BET</div>
                <div style="font-size: 15px; font-weight: 900; color: #fff;" id="bet-display">৳50</div>
            </div>
            <button class="bet-btn-nav" onclick="adjustBet('plus')">+</button>

            <button class="play-btn" id="spin-btn" onclick="handleHiLoDeal()">DEAL</button>
            
            <div class="icon-group">
                <button class="icon-btn" id="auto-btn" onclick="toggleAuto()"></button>
            </div>
        </div>
    </div>

    <!-- 🔌 [উইঙ্গো কালার ট্রেড সিঙ্ক - ইন্টারন্যাশনাল সকেট ইঞ্জিন লাইব্রেরি গেটওয়ে] -->
    <script src="/socket.io/socket.io.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const urlUserId = urlParams.get('userId') || urlParams.get('id') || urlParams.get('username') || "guest_user";
        const urlWallet = urlParams.get('wallet') || "main";

        const SERVER_URL = window.location.origin;

        let balance = 0.00;
        let currentBet = 50;
        let selectedSide = null;
        let isSpinning = false;
        let isAuto = false;
        let isMuted = false;
        let autoInterval = null;

        function adjustBet(action) {
            if (isSpinning) return;
            if (action === 'minus' && currentBet > 50) currentBet -= 50;
            if (action === 'plus' && currentBet < 20000) currentBet += 50;
            document.getElementById("bet-display").innerText = `৳${currentBet}`;
            playAudio('click');
        }

        function selectBetSide(side) {
            if (isSpinning) return;
            selectedSide = side;
            document.getElementById("board-HIGH").classList.remove("active-side-bet");
            document.getElementById("board-EQUAL").classList.remove("active-side-bet");
            document.getElementById("board-LOW").classList.remove("active-side-bet");
            document.getElementById(`board-${side}`).classList.add("active-side-bet");
            playAudio('click');
        }

        // 🎰 [🎰 ৫৪ গেমের সুপ্রিম ওরিজিনাল রুট ইমেজ সিঙ্ক জাভাস্ক্রিপ্ট ইঞ্জিন ভাই ভাই]
        function animateCardDealing(serverData) {
            const baseCardSlot = document.getElementById("base-card-container");
            const nextCardSlot = document.getElementById("next-card-container");

            const bCard = serverData.baseCard;
            const nCard = serverData.nextCard;

            // ১. বেস কার্ড রেন্ডার (সরাসরি গিটহাবের মেইন রুট ছবি থেকে কল ভাই ভাই)
            baseCardSlot.innerHTML = `
                <div class="card-deal-animation-node" style="width: 70px; height: 100px;">
                    <img src="${bCard.value}_of_${bCard.suit.toUpperCase()}.png" style="width:100%;height:100%;object-fit:cover;display:block;" alt="Base">
                </div>`;
            
            // ২. পরবর্তী কার্ড ফ্লিপ করার আগের ওল্ড জ্যাম ক্লিয়ার এবং ডিফল্ট উল্টানো ব্যাক ছবি পুশ
            nextCardSlot.innerHTML = `<div class="card-back-default card-deal-animation-node" style="width: 70px; height: 100px; border-radius: 6px; overflow: hidden;"></div>`;
            playAudio('spin');

            // 🕒 ক্যাসিনো স্টাইল ৫০০ মিলি-সেকেন্ড পর নেক্সট লাকী কার্ড ফ্লিপিং এনিমেশন নোড
            setTimeout(() => {
                nextCardSlot.innerHTML = `
                    <div class="card-deal-animation-node" style="width: 70px; height: 100px;">
                        <img src="${nCard.value}_of_${nCard.suit.toUpperCase()}.png" style="width:100%;height:100%;object-fit:cover;display:block;" alt="Next">
                    </div>`;
                playAudio('spin');
                
                // ওরিজিনাল উইন-লস রিওয়ার্ড উইন্ডো সচল করা হলো
                showFinalGameReward(serverData.status, serverData.winAmount, serverData.result, serverData.oddsData);
            }, 600);
        }

        async function handleHiLoDeal() {
            if (isSpinning) return;
            if (!selectedSide) {
                alert("🔒 বাজি প্লে করার আগে দয়া করে HIGH, LOW বা EQUAL সিলেক্ট করুন ওস্তাদ!");
                return;
            }

            isSpinning = true;
            document.getElementById("spin-btn").disabled = true;
            document.getElementById("win-status-box").className = "win-status-container";
            document.getElementById("win-text-msg").innerText = "🎰 হাই-লো কার্ড শাফল হচ্ছে, অপেক্ষা করুন ওস্তাদ...";
            playAudio('click');

            try {
                const response = await fetch(`${SERVER_URL}/api/hilo-deal`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        userId: urlUserId,
                        amount: parseFloat(currentBet),
                        wallet: urlWallet,
                        prediction: selectedSide,
                        game: "hilomaster" // লবির শর্টকোডের সাথে ১০০% একুরেট সিঙ্ক
                    })
                });

                const serverRes = await response.json();
                
                // 🎯 [মেগা কিল ট্র্যাপ ইন্টারсеপ্টর বর্ম]: কোনো ফেক পপআপ এরর মারা ছাড়া ওয়ান-শটে লাইভ এনিমেশন সচল করবে ভাই
                if (serverRes.success || serverRes.success === true) {
                    balance = parseFloat(serverRes.balance || serverRes.data?.balance || balance);
                    document.getElementById("user-balance").innerText = balance.toFixed(2);
                    
                    if (window.parent) window.parent.postMessage({ action: "refresh_wallet" }, "*");
                    if (window.top) window.top.postMessage({ action: "refresh_wallet" }, "*");
                    
                    animateCardDealing(serverRes.gameData);
                } else {
                    alert(serverRes.message || "❌ Insufficient Balance! Please Recharge Wallet.");
                    stopHiLoState();
                }
            } catch (err) {
                console.log("Hi-Lo Data Stream Active Handle.");
                stopHiLoState();
            }
        }

        function showFinalGameReward(status, winAmount, winnerSide, oddsData) {
        const msgBox = document.getElementById("win-status-box");
        const textMsg = document.getElementById("win-text-msg");
        
        if (status === "win") {
            playAudio('win');
            if (msgBox) msgBox.className = "win-status-container win-glow-bar";
            if (textMsg) textMsg.innerHTML = `🎉 গ্র্যান্ড উইন ওস্তাদ! কার্ডটি ছিল [${winnerSide}] - ওয়ালেটে ৳${winAmount} ক্রেডিট হয়েছে ভাই ভাই!`;
        } else {
            playAudio('wheel');
            if (msgBox) msgBox.className = "win-status-container lose-glow-bar";
            if (textMsg) textMsg.innerHTML = `💥 ওহ হো মিস! পরবর্তী কার্ডটি ছিল [${winnerSide}]। আবার অন ফায়ার ট্রাই করুন!`;
        }

        // ডায়নামিক্যালি পরবর্তী ওডস রেশিও আপডেট চেইন লক ভাই ভাই
        if (oddsData) {
            if (document.getElementById("odds-high")) document.getElementById("odds-high").innerText = `x${oddsData.high}`;
            if (document.getElementById("odds-equal")) document.getElementById("odds-equal").innerText = `x${oddsData.equal}`;
            if (document.getElementById("odds-low")) document.getElementById("odds-low").innerText = `x${oddsData.low}`;
        }

        fetchLiveBalance();
        stopHiLoState();

        if (isAuto) {
            autoInterval = setTimeout(() => {
                if (isAuto) handleHiLoDeal();
            }, 3000);
        }
    }

    if (typeof io !== 'undefined') {
        const socket = io();
        socket.on("balanceUpdate", (data) => {
            if (data && data.username === urlUserId) {
                if (window.parent) window.parent.postMessage({ action: "refresh_wallet" }, "*");
                fetchLiveBalance();
            }
        });
    }

    async function fetchLiveBalance() {
        try {
            const response = await fetch(`${SERVER_URL}/api/hilo-balance?userId=${urlUserId}&wallet=${urlWallet}`);
            const serverData = await response.json();
            if (serverData.success) {
                balance = parseFloat(serverData.balance);
                if (document.getElementById("user-balance")) {
                    document.getElementById("user-balance").innerText = balance.toFixed(2);
                }
            }
        } catch (e) { console.error("HiLo balance sync lag pass"); }
    }

    // প্রথম গেম লোডিং এ ইনিশিয়াল বেস কার্ড নিয়ে আসার মেগা গেটওয়ে ট্রিক ভাই ভাই
    async function fetchInitialBaseCard() {
        try {
            const response = await fetch(`${SERVER_URL}/api/hilo-init-card`);
            const resData = await response.json();
            if (resData.success && resData.baseCard) {
                const baseCardSlot = document.getElementById("base-card-container");
                if (baseCardSlot) {
                    baseCardSlot.innerHTML = `
                        <div class="card-deal-animation-node" style="width: 70px; height: 100px;">
                            <img src="${resData.baseCard.value}_of_${resData.baseCard.suit.toUpperCase()}.png" style="width:100%;height:100%;object-fit:cover;display:block;" alt="Base">
                        </div>`;
                }
                if (resData.oddsData) {
                    if (document.getElementById("odds-high")) document.getElementById("odds-high").innerText = `x${resData.oddsData.high}`;
                    if (document.getElementById("odds-equal")) document.getElementById("odds-equal").innerText = `x${resData.oddsData.equal}`;
                    if (document.getElementById("odds-low")) document.getElementById("odds-low").innerText = `x${resData.oddsData.low}`;
                }
            }
        } catch(e) {}
    }

    window.onload = () => {
        if (window.parent) window.parent.postMessage({ action: "refresh_wallet" }, "*");
        fetchLiveBalance();
        fetchInitialBaseCard();
    };

    function toggleMute() {
        isMuted = !isMuted;
        const muteEl = document.getElementById("mute-btn");
        if (muteEl) muteEl.innerText = isMuted ? "🔇" : "🔊";
        slotSounds.click.muted = isMuted;
        slotSounds.spin.muted = isMuted;
        slotSounds.win.muted = isMuted;
        slotSounds.wheel.muted = isMuted;
    }

    function toggleAuto() {
        isAuto = !isAuto;
        const autoEl = document.getElementById("auto-btn");
        if (autoEl) autoEl.classList.toggle('active', isAuto);
        if (isAuto && !isSpinning) handleHiLoDeal();
        playAudio('click');
    }

    function stopHiLoState() {
        isSpinning = false;
        if (document.getElementById("spin-btn")) {
            document.getElementById("spin-btn").disabled = false;
        }
        if (!isAuto && autoInterval) clearTimeout(autoInterval);
    }

    const slotSounds = {
        click: new Audio('click2.mp3'),
        spin: new Audio('spin2.mp3'),
        win: new Audio('win2.mp3'),
        wheel: new Audio('wheel1.mp3')
    };
    Object.values(slotSounds).forEach(s => s.load());

    function playAudio(type) {
        if (isMuted) return;
        try {
            slotSounds[type].currentTime = 0;
            slotSounds[type].play();
        } catch(e) {}
    }
</script>
</body>
</html>
