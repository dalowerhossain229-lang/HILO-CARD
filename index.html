<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HI-LO CARD MASTER</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- 🎰 ক্যাসিনো হেডার প্যানেল -->
    <div class="header">
        <div class="brand">
            <div class="name">HI-LO CARD</div>
            <div class="game">PREDICT THE NEXT CARD</div>
        </div>
        <div class="header-right">
            <button class="sound-btn" id="mute-btn" onclick="toggleMute()">🔊</button>
            <div class="balance-box">৳ <span id="user-balance">0.00</span></div>
        </div>
    </div>

    <!-- 🃏 [৩ডি হাই-লো তাসের লাইভ ফ্লিপিং জোন] -->
    <div class="card-display-zone">
        <div class="card-container">
            <div class="playing-card" id="main-card">🎴</div>
        </div>
    </div>

    <!-- 🏆 ইন-লাইন লাইভ বাজি ধরার ২টি প্রধান বোর্ড ঘর ভাই ভাই -->
    <div class="betting-board">
        <button class="bet-board-btn hi-bet" id="board-hi" onclick="selectBetSide('HI')">
            <span class="board-label">HI (বড়) 🔺</span>
            <span class="board-desc">পরের তাস বড় হবে</span>
        </button>
        
        <button class="bet-board-btn lo-bet" id="board-lo" onclick="selectBetSide('LO')">
            <span class="board-label">LO (ছোট) 🔻</span>
            <span class="board-desc">পরের তাস ছোট হবে</span>
        </button>
    </div>

    <!-- 🏆 ইন-লাইন লাইভ স্কোরিং মেসেজ বার -->
    <div class="win-status-container" id="win-status-box">
        <span id="win-text-msg">HI বা LO সিলেক্ট করে FLIP বোতাম চাপুন ভাই!</span>
    </div>

    <!-- 🎛️ কন্ট্রোল প্যানেল এরিয়া (৳১-৳২০০০ প্লাস-মাইনাস ও FLIP বোতাম পাশাপাশি লক ভাই) -->
    <div class="footer-controls">
        <div class="play-section">
            <div class="bet-selector">
                <button class="bet-btn-nav" onclick="adjustBet('minus')">−</button>
                <div style="text-align: center; width: 60px;">
                    <div style="font-size: 9px; color: #aaa; font-weight: bold;">BET</div>
                    <div style="font-size: 15px; font-weight: 900; color: #fff;" id="bet-display">৳৫০</div>
                </div>
                <button class="bet-btn-nav" onclick="adjustBet('plus')">+</button>
            </div>

            <button class="play-btn" id="spin-btn" onclick="handleCardFlip()">FLIP</button>

            <div class="icon-group">
                <button class="icon-btn" id="auto-btn" onclick="toggleAuto()">🔄</button>
            </div>
        </div>
    </div>

    <!-- 🔌 [উইনগো কালার ট্রেড সিঙ্ক - ইউনিভার্সাল সকেট ইঞ্জিন লাইব্রেরি ভাই] -->
    <script src="/socket.io/socket.io.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const urlUserId = urlParams.get('userId') || urlParams.get('id') || urlParams.get('username') || "guest_user";
        const urlWallet = urlParams.get('wallet') || "main";
        
        const SERVER_URL = window.location.origin;

        let balance = 0.00;
        let currentBet = 50; 
        let selectedOption = null; // HI, LO
        let isSpinning = false; 
        let isAuto = false;
        let isMuted = false;
        let autoInterval = null;

        if (typeof io !== 'undefined') {
            const socket = io();
            socket.on("balanceUpdate", (data) => {
                if (data && data.username === urlUserId) {
                    if (window.parent) window.parent.postMessage({ action: "refresh_wallet" }, "*");
                    fetchLiveBalance();
                }
            });
        }

        async function fetchLiveBalance() {
            try {
                const response = await fetch(`${SERVER_URL}/api/hilo-balance?userId=${urlUserId}&wallet=${urlWallet}`);
                const data = await response.json();
                if (data && data.success) {
                    balance = parseFloat(data.balance);
                    document.getElementById("user-balance").innerText = balance.toFixed(2);
                }
            } catch (e) { console.error("Balance lag"); }
        }

        // শুরুতে বেস কার্ড নিয়ে আসার মেথড ভাই ভাই
        async function initBaseCard() {
            try {
                const response = await fetch(`${SERVER_URL}/api/hilo-init?userId=${urlUserId}`);
                const data = await response.json();
                if (data && data.success) {
                    const card = document.getElementById("main-card");
                    card.innerText = `${data.baseCard.value}${data.baseCard.suit}`;
                    if (data.baseCard.suit === "♥️" || data.baseCard.suit === "♦️") card.style.color = "#ea2027";
                }
            } catch (e) { console.error("Card initialization issue"); }
        }

        window.onload = () => {
            if (window.parent) window.parent.postMessage({ action: "refresh_wallet" }, "*");
            fetchLiveBalance();
            initBaseCard();
        };

        function selectBetSide(side) {
            if (isSpinning) return;
            selectedOption = side;
            
            document.querySelectorAll(".bet-board-btn").forEach(b => b.classList.remove("active-side-bet"));
            if (side === 'HI') document.getElementById("board-hi").classList.add("active-side-bet");
            if (side === 'LO') document.getElementById("board-lo").classList.add("active-side-bet");
            
            playAudio('click');
        }

        function adjustBet(action) {
            if (isSpinning) return;
            if (action === 'minus' && currentBet > 1) {
                if (currentBet <= 10) currentBet -= 1;
                else if (currentBet <= 100) currentBet -= 10;
                else currentBet -= 50;
            }
            if (action === 'plus' && currentBet < 2000) {
                if (currentBet < 10) currentBet += 1;
                else if (currentBet < 100) currentBet += 10;
                else currentBet += 50;
            }
            if (currentBet < 1) currentBet = 1;
            if (currentBet > 2000) currentBet = 2000;
            
            document.getElementById("bet-display").innerText = `৳${currentBet}`;
            playAudio('click');
        }

        function toggleMute() {
            isMuted = !isMuted;
            document.getElementById("mute-btn").innerText = isMuted ? "🔇" : "🔊";
            document.getElementById("mute-btn").classList.toggle("muted-active", isMuted);
        }

        function toggleAuto() {
            isAuto = !isAuto;
            document.getElementById("auto-btn").classList.toggle("active", isAuto);
            if (isAuto && !isSpinning) handleCardFlip();
            playAudio('click');
        }

        async function handleCardFlip() {
            if (isSpinning) return;
            if (!selectedOption) {
                alert("🚨 আগে বাজি ধরার যেকোনো ১টি ঘর (HI বা LO) সিলেক্ট করুন ভাই!");
                isAuto = false;
                document.getElementById("auto-btn").classList.remove("active");
                return;
            }

            const card = document.getElementById("main-card");
            const msgBox = document.getElementById("win-status-box");
            
            msgBox.className = "win-status-container";
            document.getElementById("win-text-msg").innerText = "🃏 তাস ফ্লিপ হচ্ছে...";

            // ওল্ড কার্ড ৩ডি এনিমেশন বাউন্স ভাই ভাই
            card.className = "playing-card card-flipping";
            card.innerText = "🎴";
            card.style.color = "#fff";

            isSpinning = true;
            document.getElementById("spin-btn").disabled = true;

            // 🚀 তাস ফ্লিপ হওয়ার স্পিড সাউন্ড spin2.mp3 ফায়ার লক ভাই!
            playAudio('spin');

            try {
                const response = await fetch(`${SERVER_URL}/api/hilo-flip`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        userId: urlUserId,
                        amount: parseFloat(currentBet),
                        wallet: urlWallet,
                        prediction: selectedOption
                    })
                });

                const data = await response.json();

                if (data && data.success === true) {
                    balance = parseFloat(data.balance);
                    if (window.parent) window.parent.postMessage({ action: "refresh_wallet" }, "*");
                    if (window.top) window.top.postMessage({ action: "refresh_wallet" }, "*");

                    // ১.৫ সেকেন্ডের ৩ডি মোশন শেষ হওয়ার পর নতুন তাস ওপেন হবে ভাই ভাই
                    setTimeout(() => {
                        card.className = "playing-card";
                        card.innerText = `${data.nextCard.value}${data.nextCard.suit}`;
                        if (data.nextCard.suit === "♥️" || data.nextCard.suit === "♦️") card.style.color = "#ea2027";

                        showFinalResult(data.status, data.winAmount, data.message);
                    }, 1500);

                } else {
                    alert(data.message || "❌ Insufficient Balance! Please Recharge.");
                    stopFlipState();
                }
            } catch (err) {
                alert("⚠️ সেশন আউট! আবার FLIP বাটন চাপুন ভাই ভাই।");
                stopFlipState();
            }
        }

                function showFinalResult(status, winAmount, serverMsg) {
            const msgBox = document.getElementById("win-status-box");
            const textMsg = document.getElementById("win-text-msg");

            if (status === "win") {
                // 🎵 বাজি জিতলে win2.mp3 সাউন্ড ফায়ার লক!
                playAudio('win');
                msgBox.className = "win-status-container win-glow-bar";
                textMsg.innerText = `🏆 মেগা উইন!! ${serverMsg} (৳${winAmount})`;
            } else if (status === "push") {
                // সমান পয়েন্টের তাস পড়লে টাই রিফান্ড ভাই
                playAudio('win');
                msgBox.className = "win-status-container win-glow-bar";
                msgBox.style.background = "#e67e22";
                textMsg.innerText = `🤝 ${serverMsg} (৳${winAmount})`;
            } else {
                msgBox.className = "win-status-container lose-glow-bar";
                textMsg.innerText = `❌ ${serverMsg}`;
            }

            document.getElementById("user-balance").innerText = balance.toFixed(2);
            stopFlipState();

            if (isAuto) {
                autoInterval = setTimeout(() => {
                    if (isAuto) handleCardFlip();
                }, 2000);
            }
        }

        function stopFlipState() {
            isSpinning = false;
            document.getElementById("spin-btn").disabled = false;
            if (!isAuto && autoInterval) clearTimeout(autoInterval);
        }

        // 🎯 [৩টি তাজা প্রিমিয়াম সাউন্ড ট্র্যাক সিঙ্ক ভাই ভাই]
        const slotSounds = {
            click: new Audio('click2.mp3'),
            spin: new Audio('spin2.mp3'),
            win: new Audio('win2.mp3')
        };
        Object.values(slotSounds).forEach(s => s.load());

        function playAudio(type) { 
            if (isMuted) return; 
            try { 
                slotSounds[type].currentTime = 0; 
                slotSounds[type].play(); 
            } catch(e){} 
        }
    </script>
</body>
</html>
