<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HI-LO CARD - PREMIUM CASINO</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- 🎰 ক্যাসিনো হেডার ব্লকার (style.css দিয়ে হাইড লক করা ভাই ভাই) -->
    <div class="header">
        <div class="brand">
            <div class="class-name">HI-LO CARD</div>
            <div class="class-game">PREMIUM CASINO</div>
        </div>
        <div class="header-right">
            <button class="sound-btn" id="mute-btn" onclick="toggleMute()"></button>
            <div class="balance-box">৳ <span id="user-balance">0.00</span></div>
        </div>
    </div>

    <!-- 🃏 হাই-লো কার্ড লাইভ শোডাউন ক্যানভাস এরিয়া -->
    <div class="board-dealing-zone">
        <!-- ওরিজিনাল কারেন্ট বেস কার্ড প্যানেল -->
        <div class="board-column base-card-glow">
            <div class="column-header-title header-player">CURRENT CARD (চলতি তাস) 🃏</div>
            <div class="cards-display-grid" id="current-card-container">
                <div class="card-back-default" id="fallback-card-back"></div>
            </div>
        </div>

        <!-- পরবর্তী ড্রপ হওয়া ফলাফলের কার্ড প্যানেল -->
        <div class="board-column result-card-glow">
            <div class="column-header-title header-banker">NEXT CARD (পরবর্তী তাস) 🔮</div>
            <div class="cards-display-grid" id="next-card-container">
                <div class="card-back-default"></div>
            </div>
        </div>
    </div>

    <!-- 💸 উঁচু নাকি নিচু? বাজি প্রেডিকশন প্রধান ২ can নিয়ন মডিউল বোতাম চ্যাম -->
    <div class="betting-board" id="prediction-controls-zone">
        <button class="bet-board-btn hi-select-btn" id="guess-HI" onclick="handleHiLoGuess('HI')" disabled>
            <span class="board-label">📈 HI (উঁচু)</span>
            <span class="board-odds">x1.95</span>
        </button>

        <button class="bet-board-btn lo-select-btn" id="guess-LO" onclick="handleHiLoGuess('LO')" disabled>
            <span class="board-label">📉 LO (নিচু)</span>
            <span class="board-odds">x1.95</span>
        </button>
    </div>

    <!-- 📢 উইন-লস লাইভ ক্যাসিনো মেসেজ প্যানেল বার -->
    <div class="win-status-container" id="win-status-box">
        <span id="win-text-msg">বাজি সেট করে DEAL বোতাম চেপে কার্ড ড্র করুন ওস্তাদ!</span>
    </div>

    <!-- 🎛️ নিচের প্রধান কন্ট্রোল প্যানেল ফুটার (DEAL অ্যাকশন বাটন লক) -->
    <div class="footer-controls">
        <div class="play-section">
            <button class="bet-btn-nav" onclick="adjustBet('minus')">-</button>
            <div style="text-align: center; width: 60px;">
                <div style="font-size: 9px; color: #aaa; font-weight: bold;">BET</div>
                <div style="font-size: 15px; font-weight: 900; color: #fff;" id="bet-display">৳50</div>
            </div>
            <button class="bet-btn-nav" onclick="adjustBet('plus')">+</button>

            <button class="play-btn" id="spin-btn" onclick="handleStartHiLoDeal()">DEAL</button>
            
            <div class="icon-group">
                <button class="icon-btn" id="auto-btn" onclick="toggleAuto()"></button>
            </div>
        </div>
    </div>

    <!-- 🔌 [উইঙ্গো কালারトレード সিঙ্ক - ইন্টারন্যাশনাল সকেট ইঞ্জিন লাইব্রেরি গেটওয়ে] -->
    <script src="/socket.io/socket.io.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const urlUserId = urlParams.get('userId') || urlParams.get('id') || urlParams.get('username') || "guest_user";
        const urlWallet = urlParams.get('wallet') || "main";

        const SERVER_URL = window.location.origin;

        let balance = 0.00;
        let currentBet = 50;
        let isSpinning = false;
        let isAuto = false;
        let isMuted = false;
        let autoInterval = null;

        function adjustBet(action) {
            if (isSpinning) return;
            if (action === 'minus' && currentBet > 50) currentBet -= 50;
            if (action === 'plus' && currentBet < 20000) currentBet += 50;
            document.getElementById("bet-display").innerText = `৳${currentBet}`;
            playAudio('click');
        }

        function toggleActionButtons(enableGuessing) {
            if (enableGuessing) {
                if (document.getElementById("guess-HI")) document.getElementById("guess-HI").disabled = false;
                if (document.getElementById("guess-LO")) document.getElementById("guess-LO").disabled = false;
                if (document.getElementById("spin-btn")) document.getElementById("spin-btn").disabled = true;
            } else {
                if (document.getElementById("guess-HI")) document.getElementById("guess-HI").disabled = true;
                if (document.getElementById("guess-LO")) document.getElementById("guess-LO").disabled = true;
                if (document.getElementById("spin-btn")) document.getElementById("spin-btn").disabled = false;
            }
        }

        // 🛫 ১ম ধাপ: বাজি ধরে প্রথম বেস কার্ড ড্রপ করার মডিউল চ্যাম
        async function handleStartHiLoDeal() {
            if (isSpinning || isSpinning === true) return;
            isSpinning = true;
            
            toggleActionButtons(false);
            document.getElementById("spin-btn").disabled = true;
            document.getElementById("win-status-box").className = "win-status-container";
            document.getElementById("win-text-msg").innerText = "🎰 ক্যাসিনো কার্ড শেফলিং করা হচ্ছে...";
            
            document.getElementById("current-card-container").innerHTML = '<div class="card-back-default"></div>';
            document.getElementById("next-card-container").innerHTML = '<div class="card-back-default"></div>';
            playAudio('click');

            try {
                const response = await fetch(`${SERVER_URL}/api/hilo-deal`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        userId: urlUserId,
                        amount: parseFloat(currentBet),
                        wallet: urlWallet
                    })
                });

                const serverRes = await response.json();
                
                if (serverRes.success || serverRes.success === true) {
                    let parsedLiveBalance = serverRes.balance || serverRes.data?.balance || balance;
                    balance = parseFloat(parsedLiveBalance);
                    document.getElementById("user-balance").innerText = balance.toFixed(2);
                    
                    if (window.parent) window.parent.postMessage({ action: "refresh_wallet" }, "*");
                    if (window.top) window.top.postMessage({ action: "refresh_wallet" }, "*");
                    
                    let targetPayload = serverRes.gameData || serverRes;
                    
                    // বেস কার্ড স্ক্রিনে রেন্ডার
                    setTimeout(() => {
                        const cZone = document.getElementById("current-card-container");
                        cZone.innerHTML = "";
                        let cVal = String(targetPayload.currentCard.value).toUpperCase();
                        let cSuit = String(targetPayload.currentCard.suit).toUpperCase();
                        
                        const cardDiv = document.createElement("div");
                        cardDiv.className = "card-deal-animation-node";
                        cardDiv.style.width = "75px"; cardDiv.style.height = "105px";
                        cardDiv.innerHTML = `<img src="${cVal}_of_${cSuit}.png" style="width:100%;height:100%;object-fit:cover;display:block;" onerror="this.src='card-back.png'">`;
                        cZone.appendChild(cardDiv);
                        playAudio('spin');
                        
                        // 🎯 বেস কার্ড রেন্ডার শেষ হওয়া মাত্রই HI/LO বোতাম গোল্ডেন নিয়নে অন হবে!
                        toggleActionButtons(true);
                        document.getElementById("win-text-msg").innerText = "📈 পরবর্তী তাসটি এই তাসের চেয়ে বড় (HI) নাকি ছোট (LO) হবে? প্রেডিক্ট করুন ওস্তাদ!";
                    }, 400);

                } else {
                    alert(serverRes.message || "❌ Insufficient Balance! Please Recharge Wallet.");
                    resetHiLoGameState();
                }
            } catch (err) {
                console.log("Hi-Lo Deal Core Gateway sync error.");
                resetHiLoGameState();
            }
        }

        // 🛫 ২য় ধাপ: প্লেয়ার উঁচু (HI) বা নিচু (LO) বোতাম চাপলে ফাইনাল উইন-লস সেটেলমেন্ট এপিআই হিট চ্যাম
        async function handleHiLoGuess(playerChoice) {
            playAudio('click');
            toggleActionButtons(false);
            document.getElementById("win-text-msg").innerText = `🔮 আপনার চাল [${playerChoice}] প্রসেসিং হচ্ছে...`;

            try {
                const response = await fetch(`${SERVER_URL}/api/hilo-guess`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        userId: urlUserId,
                        choice: playerChoice
                    })
                });

                                const serverRes = await response.json();
                
                // 🎯 [অন্দর বাহার ও ব্যাকারাত স্টাইল মেগা ডাটা ইন্টারсеপ্টর বর্ম ওস্তাদ]
                if (serverRes.success || serverRes.success === true) {
                    let parsedLiveBalance = serverRes.balance || serverRes.data?.balance || balance;
                    balance = parseFloat(parsedLiveBalance);
                    if (document.getElementById("user-balance")) {
                        document.getElementById("user-balance").innerText = balance.toFixed(2);
                    }
                    
                    if (window.parent) window.parent.postMessage({ action: "refresh_wallet" }, "*");
                    if (window.top) window.top.postMessage({ action: "refresh_wallet" }, "*");

                    let targetPayload = serverRes.gameData || serverRes;
                    
                    // পরবর্তী তাস নিয়ন ক্যানভাসে রেন্ডার
                    setTimeout(() => {
                        const nZone = document.getElementById("next-card-container");
                        if (nZone) nZone.innerHTML = "";
                        let nVal = String(targetPayload.nextCard.value).toUpperCase();
                        let nSuit = String(targetPayload.nextCard.suit).toUpperCase();
                        
                        const cardDiv = document.createElement("div");
                        cardDiv.className = "card-deal-animation-node";
                        cardDiv.style.width = "75px"; cardDiv.style.height = "105px";
                        cardDiv.innerHTML = `<img src="${nVal}_of_${nSuit}.png" style="width:100%;height:100%;object-fit:cover;display:block;" onerror="this.src='card-back.png'">`;
                        if (nZone) nZone.appendChild(cardDiv);
                        playAudio('spin');
                        
                        // ৩. ফলাফল পুরস্কার নোটিশ পুশ
                        setTimeout(() => {
                            showFinalGameReward(serverRes.status, serverRes.winAmount, serverRes.result);
                        }, 400);

                    }, 400);

                } else {
                    alert(serverRes.message || "X Guess registration declined!");
                    resetHiLoGameState();
                }
            } catch (err) {
                console.log("Hi-Lo Card Next Action Hook Exception Handler.");
                resetHiLoGameState();
            }
        }

        function showFinalGameReward(status, winAmount, winnerReason) {
            const msgBox = document.getElementById("win-status-box");
            const textMsg = document.getElementById("win-text-msg");
            
            if (status === "win") {
                playAudio('win');
                if (msgBox) msgBox.className = "win-status-container win-glow-bar";
                if (textMsg) textMsg.innerHTML = `🎉 ওস্তাদ! [<b>${winnerReason}</b>] - ওয়ালেটে ৳${winAmount} ক্রেডিট হয়েছে ভাই ভাই!`;
            } else if (status === "push") {
                playAudio('click');
                if (msgBox) msgBox.className = "win-status-container win-glow-bar";
                if (textMsg) textMsg.innerHTML = `⧗ পুশ (ড্র) ওস্তাদ! [<b>${winnerReason}</b>] - আসল টাকা ওয়ালেটে রিফান্ড ব্যাক হয়েছে!`;
            } else {
                playAudio('wheel');
                if (msgBox) msgBox.className = "win-status-container lose-glow-bar";
                if (textMsg) textMsg.innerHTML = `💥 লস ওস্তাদ! [<b>${winnerReason}</b>]। আবার DEAL চেপে অন ফায়ার কদম ফেলুন ভাই ভাই!`;
            }

            fetchLiveBalance();
            resetHiLoGameState();

            if (isAuto) {
                autoInterval = setTimeout(() => {
                    if (isAuto) handleStartHiLoDeal();
                }, 3500);
            }
        }

        if (typeof io !== 'undefined') {
            const socket = io();
            socket.on("balanceUpdate", (data) => {
                if (data && data.username === urlUserId) {
                    if (window.parent) window.parent.postMessage({ action: "refresh_wallet" }, "*");
                    fetchLiveBalance();
                }
            });
        }

        async function fetchLiveBalance() {
            try {
                const response = await fetch(`${SERVER_URL}/api/hilo-balance?userId=${urlUserId}&wallet=${urlWallet}`);
                const serverData = await response.json();
                if (serverData.success) {
                    balance = parseFloat(serverData.balance);
                    if (document.getElementById("user-balance")) {
                        document.getElementById("user-balance").innerText = balance.toFixed(2);
                    }
                }
            } catch (e) { console.error("Balance synchronization lag"); }
        }

        window.onload = () => {
            if (window.parent) window.parent.postMessage({ action: "refresh_wallet" }, "*");
            fetchLiveBalance();
        };

        function toggleMute() {
            isMuted = !isMuted;
            const muteEl = document.getElementById("mute-btn");
            if (muteEl) muteEl.innerText = isMuted ? "🔇" : "🔊";
            slotSounds.click.muted = isMuted; slotSounds.spin.muted = isMuted;
            slotSounds.win.muted = isMuted; slotSounds.wheel.muted = isMuted;
        }

        function toggleAuto() {
            isAuto = !isAuto;
            const autoEl = document.getElementById("auto-btn");
            if (autoEl) autoEl.classList.toggle('active', isAuto);
            if (isAuto && !isSpinning) handleStartHiLoDeal();
            playAudio('click');
        }

        function resetHiLoGameState() {
            isSpinning = false;
            toggleActionButtons(false);
            if (!isAuto && autoInterval) clearTimeout(autoInterval);
        }

        const slotSounds = {
            click: new Audio('click2.mp3'), spin: new Audio('spin2.mp3'),
            win: new Audio('win2.mp3'), wheel: new Audio('wheel1.mp3')
        };
        Object.values(slotSounds).forEach(s => s.load());

        function playAudio(type) {
            if (isMuted) return;
            try { slotSounds[type].currentTime = 0; slotSounds[type].play(); } catch(e) {}
        }
    </script>
</body>
</html>
